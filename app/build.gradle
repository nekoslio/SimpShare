plugins {
    id 'com.android.application'
}

// 发布签名：本地生成 keystore（不入库）后自动使用；不存在时回退 debug 签名，保证可构建
// 查找顺序：仓库根（worktree 布局时的共享目录）→ android 分支根
def ksCandidates = [rootProject.file('.build-tools/release.keystore'),
                    rootProject.file('../.build-tools/release.keystore')]
def ksFile = ksCandidates.find { it.exists() }
def localProps = new Properties()
def lpCandidates = [rootProject.file('local.properties'),
                    rootProject.file('../local.properties')]
def lpFile = lpCandidates.find { it.exists() }
if (lpFile != null) {
    localProps.load(new FileInputStream(lpFile))
}

android {
    namespace 'com.nekoslio.simpshare'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nekoslio.simpshare'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.0.7'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword localProps.getProperty('simpshare.storePassword', 'simpshare')
                keyAlias 'simpshare'
                keyPassword localProps.getProperty('simpshare.keyPassword', 'simpshare')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.zxing:core:3.5.3'
}
